<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor Profesional IA</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 800px;
  margin: auto;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.progress {
  font-size: 28px;
  font-weight: bold;
  text-align: center;
}

#chatBox {
  height: 260px;
  overflow-y: auto;
  border: 1px solid #ddd;
  padding: 10px;
  border-radius: 8px;
  background: #fafafa;
}

.msg-user {
  text-align: right;
  margin: 8px 0;
}

.msg-tutor {
  text-align: left;
  margin: 8px 0;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">

  <div class="card">
    <h2>Progreso del Plan</h2>
    <div class="progress" id="progress">0%</div>
  </div>

  <div class="card">
    <h2>Chat Tutor IA</h2>
    <div id="chatBox">
      <div class="msg-tutor">
        <strong>Tutor:</strong> Hola, soy tu tutor personal. ¿Qué deseas aprender hoy?
      </div>
    </div>

    <input id="userInput" placeholder="Escribe tu mensaje aquí...">
    <button onclick="enviarMensaje()">Enviar</button>
    <button onclick="iniciarQuiz()">Iniciar Quiz</button>
  </div>

</div>

<script>
/* ===========================
   Estado y Progreso
   =========================== */

let xp = Number(localStorage.getItem("xp")) || 0;

function actualizarXP() {
  document.getElementById("progress").textContent =
    Math.min(100, xp) + "%";
}

actualizarXP();

/* ===========================
   Motor del Tutor (escalable)
   =========================== */

async function obtenerRespuestaTutor(texto) {
  texto = texto.toLowerCase();

  if (texto.includes("datos")) {
    return "Los datos permiten tomar decisiones informadas. Se recolectan, analizan y se convierten en información útil.";
  }

  if (texto.includes("estrategia")) {
    return "La estrategia define cómo alcanzar objetivos considerando recursos, contexto y prioridades.";
  }

  if (texto.includes("power bi")) {
    return "Power BI es una herramienta para convertir datos en visualizaciones claras y accionables.";
  }

  if (texto.includes("comunicación")) {
    return "La comunicación efectiva transmite ideas con claridad, propósito y adaptación al interlocutor.";
  }

  return "Buen planteamiento. ¿Prefieres una explicación sencilla o un ejemplo práctico?";
}

/* ===========================
   Chat
   =========================== */

function enviarMensaje() {
  const input = document.getElementById("userInput");
  const chat = document.getElementById("chatBox");
  const texto = input.value.trim();

  if (!texto) return;

  chat.innerHTML += `
    <div class="msg-user">
      <strong>Tú:</strong> ${texto}
    </div>`;

  input.value = "";
  xp += 10;
  localStorage.setItem("xp", xp);
  actualizarXP();

  setTimeout(async () => {
    const respuesta = await obtenerRespuestaTutor(texto);
    chat.innerHTML += `
      <div class="msg-tutor">
        <strong>Tutor:</strong> ${respuesta}
      </div>`;
    chat.scrollTop = chat.scrollHeight;
  }, 500);
}

/* ===========================
   Quiz
   =========================== */

function iniciarQuiz() {
  const r = prompt(
    "Quiz rápido:\n¿Cuál es la función principal de un tutor?\n\nA) Evaluar\nB) Enseñar\nC) Castigar"
  );

  if (!r) return;

  if (r.toUpperCase() === "B") {
    alert("Correcto. Enseñar es el objetivo principal.");
    xp += 30;
  } else {
    alert("Incorrecto. La respuesta correcta es B.");
    xp += 10;
  }

  localStorage.setItem("xp", xp);
  actualizarXP();
}
</script>

</body>
</html>
