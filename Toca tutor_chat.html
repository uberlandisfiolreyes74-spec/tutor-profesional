<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tutor Personal IA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 12px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    h2, h3 {
      margin-top: 0;
    }

    .progress {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }

    #chatBox {
      height: 220px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 8px;
      overflow-y: auto;
      background: #fafafa;
      margin-bottom: 8px;
      font-size: 14px;
    }

    #chatBox p {
      margin: 6px 0;
    }

    #userInput {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
    }

    button:active {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- PROGRESO -->
    <div class="card">
      <h3>Progreso</h3>
      <p class="progress">0%</p>
      <p style="font-size:12px; color:#555;">
        Avanza interactuando con el tutor
      </p>
    </div>

    <!-- CHAT -->
    <div class="card">
      <h3>Chat Tutor IA</h3>

      <div id="chatBox">
        <p><strong>Tutor:</strong> Hola, soy tu tutor personal. ¿Qué deseas aprender hoy?</p>
      </div>

      <input
        id="userInput"
        type="text"
        placeholder="Escribe tu mensaje aquí..."
      />

      <button onclick="enviarMensaje()">
        Enviar
      </button>
    </div>

    <!-- QUIZ -->
    <div class="card">
      <h3>Refuerzo</h3>
      <button onclick="iniciarQuiz()">
        Iniciar Quiz
      </button>
    </div>

  </div>

  <!-- ============================= -->
  <!-- PEGA AQUÍ TU ARCHIVO JS -->
  <!-- ============================= -->
  <script>
    /* AQUÍ VA EXACTAMENTE
       EL CÓDIGO JAVASCRIPT
       QUE YA PEGASTE
       (NO CAMBIES NADA) */
  </script>

</body>
</html>
