<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor Profesional IA</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 800px;
  margin: auto;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.progress {
  font-size: 28px;
  font-weight: bold;
  text-align: center;
}

#chatBox {
  height: 260px;
  overflow-y: auto;
  border: 1px solid #ddd;
  padding: 10px;
  border-radius: 8px;
  background: #fafafa;
}

.msg-user {
  text-align: right;
  margin: 8px 0;
}

.msg-tutor {
  text-align: left;
  margin: 8px 0;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">

  <div class="card">
    <h2>Progreso del Plan</h2>
    <div class="progress" id="progress">0%</div>
  </div>

  <div class="card">
    <h2>Chat Tutor IA</h2>
    <div id="chatBox">
      <div class="msg-tutor"><strong>Tutor:</strong> Hola, soy tu tutor personal. ¿Qué deseas aprender hoy?</div>
    </div>

    <input id="userInput" placeholder="Escribe tu mensaje aquí...">
    <button onclick="enviarMensaje()">Enviar</button>
    <button onclick="iniciarQuiz()">Iniciar Quiz</button>
  </div>

</div>

<script>
let xp = Number(localStorage.getItem("xp")) || 0;

function actualizarXP() {
  const porcentaje = Math.min(100, xp);
  document.getElementById("progress").textContent = porcentaje + "%";
}

actualizarXP();

function enviarMensaje() {
  const input = document.getElementById("userInput");
  const chat = document.getElementById("chatBox");
  const texto = input.value.trim();
  if (!texto) return;

  chat.innerHTML += `<div class="msg-user"><strong>Tú:</strong> ${texto}</div>`;
  input.value = "";
  xp += 10;
  localStorage.setItem("xp", xp);
  actualizarXP();

  setTimeout(() => {
    chat.innerHTML += `
      <div class="msg-tutor">
        <strong>Tutor:</strong>
        Bien. Vamos paso a paso. ¿Quieres explicación o un ejemplo práctico?
      </div>`;
    chat.scrollTop = chat.scrollHeight;
  }, 500);
}

function iniciarQuiz() {
  const r = prompt("Quiz rápido:\n¿Qué hace un buen tutor?\nA) Evalúa\nB) Enseña\nC) Castiga");

  if (!r) return;

  if (r.toUpperCase() === "B") {
    alert("Correcto.");
    xp += 30;
  } else {
    alert("Incorrecto. Respuesta correcta: B");
    xp += 10;
  }

  localStorage.setItem("xp", xp);
  actualizarXP();
}
</script>

</body>
</html>
